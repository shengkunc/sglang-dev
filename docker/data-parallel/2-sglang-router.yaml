apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-router
  namespace: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-router
  template:
    metadata:
      labels:
        app: sglang-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: rog-strix-b550-f
      containers:
      - name: router
        image: docker.io/lmsysorg/sglang:latest
        imagePullPolicy: Always
        command:
        - /bin/sh
        - -c
        - |
          # -------------------------------------------------------
          # FIX: Explicitly login to save token to disk
          # -------------------------------------------------------
          echo "Authenticating with Hugging Face..."
          python3 -c "import huggingface_hub; huggingface_hub.login(token='$HF_TOKEN')"
          
          echo "Starting Router..."
          python3 -m sglang_router.launch_router \
            --host 0.0.0.0 \
            --port 30000 \
            --balance-abs-threshold 4 \
            --balance-rel-threshold 1.2 \
            --worker-urls \
              http://sglang-worker-0.sglang-worker-headless.sglang.svc.cluster.local:30000 \
              http://sglang-worker-1.sglang-worker-headless.sglang.svc.cluster.local:30000
        env:
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: HF_TOKEN
              name: hf-token
        - name: OTEL_SERVICE_NAME
          value: "sglang-router"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: http://otel-collector.observability.svc.cluster.local:4317
        ports:
        - containerPort: 30000
        
        livenessProbe:
          tcpSocket:
            port: 30000
          initialDelaySeconds: 30
          periodSeconds: 10
        
        volumeMounts:
        - mountPath: /root/.cache/huggingface
          name: hf-cache

      volumes:
      - name: hf-cache
        hostPath:
          path: /root/.cache/huggingface
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sglang-entrypoint
  namespace: sglang
spec:
  type: NodePort
  selector:
    app: sglang-router
  ports:
  - protocol: TCP
    port: 30000
    targetPort: 30000
    nodePort: 30000
