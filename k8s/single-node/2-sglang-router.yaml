apiVersion: apps/v1
kind: Deployment
metadata:
  name: sglang-router
  namespace: sglang
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sglang-router
  template:
    metadata:
      labels:
        app: sglang-router
    spec:
      nodeSelector:
        kubernetes.io/hostname: rog-strix-b550-f
      containers:
        - name: router
          image: docker.io/lmsysorg/sgl-model-gateway:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting SGLang Model Gateway..."
              python3 -m sglang_router.launch_router \
                --host 0.0.0.0 \
                --port 30000 \
                --policy cache_aware \
                --balance-abs-threshold 4 \
                --balance-rel-threshold 1.2 \
                --api-key "$SGLANG_API_KEY" \
                --worker-urls http://sglang-worker-0.sglang-worker-headless.sglang.svc.cluster.local:30000 \
                --enable-trace \
                --otlp-traces-endpoint otel-collector.observability.svc.cluster.local:4317
          env:
            - name: SGLANG_API_KEY
              valueFrom:
                secretKeyRef:
                  name: sglang-api-key
                  key: api-key
            - name: OTEL_SERVICE_NAME
              value: "sglang-router"
          ports:
            - name: http
              containerPort: 30000
          livenessProbe:
            httpGet:
              path: /liveness
              port: 30000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readiness
              port: 30000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: sglang-entrypoint
  namespace: sglang
spec:
  type: NodePort
  selector:
    app: sglang-router
  ports:
    - name: http
      protocol: TCP
      port: 30000
      targetPort: 30000
      nodePort: 30000

